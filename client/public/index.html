<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>figma-sync-demo</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif;
    display: flex; height: 100vh; background: #1e1e1e; color: #eee;
  }
  #canvas-wrap { position: relative; flex: 1; overflow: hidden; }
  #canvas {
    position: relative; width: 100%; height: 100%;
    background:
      linear-gradient(#2a2a2a 1px, transparent 1px),
      linear-gradient(90deg, #2a2a2a 1px, transparent 1px);
    background-size: 24px 24px;
  }
  .node {
    position: absolute; width: 120px; height: 70px; border-radius: 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; font-size: 13px; cursor: grab; user-select: none;
    box-shadow: 0 2px 8px rgba(0,0,0,.4); border: 2px solid rgba(255,255,255,.15);
    transition: border-color .15s, box-shadow .15s;
  }
  .node.dragging { cursor: grabbing; opacity: .9; }
  .node.rejected { animation: shake .3s; border-color: #ff4d4f !important; box-shadow: 0 0 0 3px rgba(255,77,79,.6); }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
  .node small { opacity: .8; font-size: 10px; margin-top: 2px; }
  svg#links { position: absolute; inset: 0; }
  #sidebar { width: 340px; background: #161616; border-left: 1px solid #333; display: flex; flex-direction: column; }
  #layers, #log { padding: 12px; overflow-y: auto; }
  #layers { border-bottom: 1px solid #333; max-height: 45%; }
  #log { flex: 1; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; line-height: 1.6; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #999; margin: 0 0 10px; }
  .layer-row { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 6px; background: #222; margin-bottom: 6px; flex-wrap: wrap; }
  .swatch { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
  .layer-row .name { flex: 1; min-width: 90px; font-size: 12px; }
  .layer-row select { background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 4px; font-size: 11px; }
  .layer-row button { background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 4px; cursor: pointer; font-size: 11px; padding: 2px 6px; }
  .layer-row.nested { opacity: .7; font-size: 11px; }
  .log-line.opt { color: #e8c547; }
  .log-line.confirm { color: #5fd97f; }
  .log-line.remote { color: #5fb0f5; }
  .log-line.reject { color: #ff6b6b; }
  #toolbar { position: absolute; top: 10px; left: 10px; display: flex; gap: 8px; z-index: 5; align-items: center; }
  #toolbar button, #status { background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 6px 10px; font-size: 12px; }
  #status { cursor: default; }
  #hint { position: absolute; bottom: 10px; left: 10px; font-size: 11px; color: #888; max-width: 480px; z-index: 5; }
  #cursor-layer, #selection-layer { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
  .remote-cursor { position: absolute; transform: translate(-1px, -1px); display: flex; align-items: flex-start; gap: 4px; }
  .remote-cursor .cursor-icon { flex-shrink: 0; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  .remote-cursor .label { font-size: 10px; padding: 1px 5px; border-radius: 4px; color: #fff; white-space: nowrap; margin-top: 10px; }
  .selection-box { position: absolute; border: 1.5px dashed; background: currentColor; opacity: .9; }
  .selection-box.own { border-color: #fff; background: rgba(255,255,255,.08); }
  .selection-box.remote { background-color: color-mix(in srgb, currentColor 15%, transparent); }
</style>
</head>
<body>
  <div id="canvas-wrap">
    <div id="toolbar">
      <button id="add-node">+ ノード追加</button>
      <span id="status">接続中...</span>
    </div>
    <svg id="links"></svg>
    <div id="canvas"></div>
    <div id="selection-layer"></div>
    <div id="cursor-layer"></div>
    <div id="hint">ドラッグで移動 (楽観的更新) / ダブルクリックで色変更 (LWW) / 他ノードの上にドロップで親子関係変更 (循環参照は拒否されます) / 何もない場所をドラッグすると範囲選択・カーソルも他タブに同期されます</div>
  </div>
  <div id="sidebar">
    <div id="layers"><h2>レイヤー (root配下・Fractional Index順)</h2><div id="layers-list"></div></div>
    <div id="log"><h2>イベントログ</h2><div id="log-list"></div></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
